{{- $ingress := .Values.storeIngress | default .Values.ingress }}
{{- if $ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-ingress
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: woocommerce-store
  annotations:
    {{- toYaml $ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ $ingress.className | default "nginx" }}
  tls:
    - hosts:
        - {{ .Values.wordpress.host }}
      {{- if $ingress.tlsSecretName }}
      secretName: {{ $ingress.tlsSecretName }}
      {{- end }}
  rules:
    - host: {{ .Values.wordpress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
{{- end }}
