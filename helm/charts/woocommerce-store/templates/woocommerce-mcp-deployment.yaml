apiVersion: apps/v1
kind: Deployment
metadata:
  name: woocommerce-mcp
  labels:
    app.kubernetes.io/name: woocommerce-mcp
    app.kubernetes.io/part-of: woocommerce-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: woocommerce-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: woocommerce-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mcp-server
          image: "{{ .Values.woocommerceMcp.image.repository }}:{{ .Values.woocommerceMcp.image.tag }}"
          imagePullPolicy: {{ .Values.woocommerceMcp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: WOOCOMMERCE_API_URL
              value: "http://wordpress.woocommerce.svc.cluster.local:80"
            - name: WOOCOMMERCE_HOST_HEADER
              value: {{ .Values.wordpress.host | quote }}
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: wordpress-secret
                  key: WOOCOMMERCE_CONSUMER_KEY
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: wordpress-secret
                  key: WOOCOMMERCE_CONSUMER_SECRET
            - name: WOOCOMMERCE_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wordpress-secret
                  key: WOOCOMMERCE_MCP_TOKEN
          resources:
            {{- toYaml .Values.woocommerceMcp.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
