apiVersion: v1
kind: Secret
metadata:
  name: wordpress-secret
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: woocommerce-store
type: Opaque
stringData:
  WORDPRESS_DB_HOST: "mariadb.woocommerce.svc.cluster.local:3306"
  WORDPRESS_DB_USER: {{ .Values.mariadb.auth.username | quote }}
  WORDPRESS_DB_PASSWORD: {{ .Values.mariadb.auth.password | quote }}
  WORDPRESS_DB_NAME: {{ .Values.mariadb.auth.database | quote }}
  WORDPRESS_ADMIN_USER: {{ .Values.wordpress.adminUser | quote }}
  WORDPRESS_ADMIN_PASSWORD: {{ .Values.wordpress.adminPassword | quote }}
  WORDPRESS_ADMIN_EMAIL: {{ .Values.wordpress.adminEmail | quote }}
  WOOCOMMERCE_CONSUMER_KEY: {{ .Values.woocommerce.consumerKey | quote }}
  WOOCOMMERCE_CONSUMER_SECRET: {{ .Values.woocommerce.consumerSecret | quote }}
  WOOCOMMERCE_MCP_TOKEN: {{ .Values.woocommerce.mcpInternalToken | quote }}
