apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.postgres.db.user }}:{{ .Values.postgres.db.password }}@postgres.gateway.svc.cluster.local:5432/{{ .Values.postgres.db.name }}"
  JWT_SECRET: {{ .Values.gateway.env.jwtSecret | quote }}
  ENCRYPTION_KEY: {{ .Values.gateway.env.encryptionKey | quote }}
  WOOCOMMERCE_MCP_TOKEN: {{ .Values.gateway.env.woocommerceMcpToken | quote }}
  ADMIN_EMAIL: {{ .Values.gateway.env.adminEmail | quote }}
  ADMIN_PASSWORD: {{ .Values.gateway.env.adminPassword | quote }}
  OPENAI_API_KEY: {{ .Values.gateway.env.openaiApiKey | default "" | quote }}
  OPENAI_MODEL: {{ .Values.gateway.env.openaiModel | default "gpt-6-luna" | quote }}
  GEMINI_API_KEY: {{ .Values.gateway.env.geminiApiKey | default "" | quote }}
  GROQ_API_KEY: {{ .Values.gateway.env.groqApiKey | default "" | quote }}
