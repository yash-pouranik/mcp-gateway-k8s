# ==============================================================================
# Helm Environment Values — Local Development (k3d / kind cluster)
# ==============================================================================

global:
  environment: local
  domainSuffix: localtest.me
  tls:
    enabled: true
    clusterIssuer: ""

# 1. Gateway & Dashboard Configuration (helm/charts/gateway)
gateway:
  image:
    repository: mcp-platform/gateway
    tag: v1.0.9
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  env:
    jwtSecret: "super-secure-local-jwt-secret-xyz"
    encryptionKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    woocommerceMcpToken: "mcp_internal_bearer_token_secret_9988"
    adminEmail: "admin@mcp-platform.local"
    adminPassword: "AdminPass123!"
    openaiModel: "gpt-6-luna"
    openaiApiKey: "" # Injected securely via secret or CLI

dashboard:
  image:
    repository: mcp-platform/dashboard
    tag: v1.0.17
    pullPolicy: IfNotPresent
  replicas: 1
  port: 80

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  db:
    name: mcpgateway
    user: mcpuser
    password: mcppassword123
  persistence:
    size: 2Gi
    storageClass: local-path

gatewayIngress:
  enabled: true
  host: dashboard.localtest.me
  tls:
    enabled: true

# 2. WooCommerce Store & Custom MCP Server (helm/charts/woocommerce-store)
mariadb:
  image:
    repository: mariadb
    tag: "11.4"
    pullPolicy: IfNotPresent
  auth:
    database: wordpress
    username: wp_user
    password: wp_secure_password_123
    rootPassword: mariadb_root_password_123
  persistence:
    size: 2Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

wordpress:
  image:
    repository: wordpress
    tag: "6.5-apache"
    pullPolicy: IfNotPresent
  host: store.localtest.me
  title: "Urumi WooCommerce Store"
  adminUser: admin
  adminPassword: AdminSecurePassword123!
  adminEmail: admin@example.com
  persistence:
    size: 2Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

woocommerce:
  consumerKey: "ck_urumi_mcp_gateway_prod_key"
  consumerSecret: "cs_urumi_mcp_gateway_prod_secret"
  mcpInternalToken: "mcp_internal_bearer_token_secret_9988"

woocommerceMcp:
  image:
    repository: mcp-platform/woocommerce-mcp
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

# 3. Secondary MCP Servers (helm/charts/extra-mcps)
fakestore:
  image:
    repository: mcp-platform/fakestore-mcp
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

notes:
  image:
    repository: mcp-platform/notes-mcp
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
