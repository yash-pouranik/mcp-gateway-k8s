name: Build and Publish Container Images

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/**'
      - '.github/workflows/docker-publish.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: .
            dockerfile: apps/gateway/Dockerfile
            image: gateway
          - name: dashboard
            context: .
            dockerfile: apps/dashboard/Dockerfile
            image: dashboard
          - name: woocommerce-mcp
            context: .
            dockerfile: apps/woocommerce-mcp/Dockerfile
            image: woocommerce-mcp
          - name: fakestore-mcp
            context: .
            dockerfile: apps/fakestore-mcp/Dockerfile
            image: fakestore-mcp
          - name: notes-mcp
            context: .
            dockerfile: apps/notes-mcp/Dockerfile
            image: notes-mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image repository name
        id: repo_name
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo_name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
