# ==============================================================================
# cert-manager ClusterIssuer — Let's Encrypt Production ACME HTTP-01
# Automatically provisions and renews trusted SSL certificates for Ingress
# ==============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: yash@urbackend.in
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
