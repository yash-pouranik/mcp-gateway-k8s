# ==============================================================================
# MCP Gateway & Platform — Strict Network Policies (Zero Trust Isolation)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NAMESPACE: woocommerce
# ------------------------------------------------------------------------------

# 1.1 Default Deny all Ingress in woocommerce namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: woocommerce
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 1.2 WordPress Ingress: Allow from ingress-nginx (port 80) and woocommerce-mcp (port 80)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wordpress-ingress
  namespace: woocommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wordpress
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from ingress-nginx controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
    # Allow internal REST API calls from woocommerce-mcp pod
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: woocommerce-mcp
      ports:
        - protocol: TCP
          port: 80
---
# 1.3 MariaDB Ingress: Strictly allow only from wordpress pod (port 3306)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mariadb-ingress
  namespace: woocommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wordpress
      ports:
        - protocol: TCP
          port: 3306
---
# 1.4 WooCommerce MCP Ingress: Strictly allow only from gateway pod (port 3000)
# (Zero public ingress, strictly ClusterIP internal)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-woocommerce-mcp-ingress
  namespace: woocommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: woocommerce-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
          podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 3000

---
