# ------------------------------------------------------------------------------
# 3. NAMESPACE: gateway
# ------------------------------------------------------------------------------

# 3.1 Default Deny all Ingress in gateway namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 3.2 Gateway Ingress: Allow from ingress-nginx (port 3000) and dashboard (port 3000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: gateway
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector:
            matchLabels:
              app: dashboard
      ports:
        - protocol: TCP
          port: 3000
---
# 3.3 Dashboard Ingress: Allow from ingress-nginx (port 80)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
